name: Local POS foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: jce_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: jce_pos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jce_test -d jce_pos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jce_test:ci_only_password@127.0.0.1:5432/jce_pos_test
      TEST_DATABASE_URL: postgresql://jce_test:ci_only_password@127.0.0.1:5432/jce_pos_test
      PG_BIN_DIR: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL 18 backup clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
